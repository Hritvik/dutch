spring:
  application:
    name: dutch-notification
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NOTIFICATION_IAM_ISSUER_URI:}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
dutch:
  notification:
    service-token: ${DUTCH_NOTIFICATION_SERVICE_TOKEN:}
