appId: com.dutch.mobile
---
- launchApp:
    clearState: true
- assertVisible: "Share costs without losing the plot."
- tapOn: "Use test identity"
- extendedWaitUntil:
    visible: "You are signed in."
    timeout: 20000
- tapOn: "View groups"
- assertVisible: "Your groups."
- tapOn: "Flat 12"
- assertVisible: "Members"
- tapOn:
    id: "invite-member"
- inputText: "mem_312345678901234567"
- hideKeyboard
- tapOn: "Invite"
- extendedWaitUntil:
    visible: "mem_312345678901234567"
    timeout: 10000
- tapOn: "Activate"
- tapOn: "Archive group"
- extendedWaitUntil:
    visible: "Reopen group"
    timeout: 10000
- tapOn: "Reopen group"
- extendedWaitUntil:
    visible: "Archive group"
    timeout: 10000
- takeScreenshot: android-group-detail
