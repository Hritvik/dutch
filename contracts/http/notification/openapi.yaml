openapi: 3.1.0
info:
  title: Dutch Notification API
  version: 1.0.0
  description: Device registration, push preferences, and notification data deletion.
paths:
  /api/v1/notifications/devices:
    post:
      operationId: registerDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRequest"
      responses:
        "200":
          description: The active device registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's device registrations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/devices/{deviceId}:
    delete:
      operationId: removeDevice
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            pattern: ^dev_[A-Za-z0-9_-]{16,128}$
      responses:
        "204":
          description: The device is inactive.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/preferences:
    get:
      operationId: getPreferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's push preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updatePreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferenceRequest"
      responses:
        "200":
          description: The updated preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/privacy:
    delete:
      operationId: deleteNotificationData
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Notification-owned data for the caller is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Invalid:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    DeviceId:
      type: string
      pattern: ^dev_[A-Za-z0-9_-]{16,128}$
    DeviceRequest:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - platform
        - pushToken
      properties:
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
        pushToken:
          type: string
          minLength: 8
          maxLength: 512
    DeviceView:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - platform
        - active
      properties:
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
        active:
          type: boolean
    DeviceListView:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - platform
        - active
        - createdAt
        - updatedAt
      properties:
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeviceResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/DeviceView"
    DeviceListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/DeviceListView"
    PreferenceRequest:
      type: object
      additionalProperties: false
      properties:
        activityPush:
          type: boolean
        settlementPush:
          type: boolean
    PreferenceView:
      type: object
      additionalProperties: false
      required:
        - activityPush
        - settlementPush
      properties:
        activityPush:
          type: boolean
        settlementPush:
          type: boolean
    PreferenceResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PreferenceView"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - correlationId
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
