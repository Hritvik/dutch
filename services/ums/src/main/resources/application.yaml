spring:
  application:
    name: dutch-ums
  flyway:
    locations: classpath:db/migration
  datasource:
    url: ${UMS_DATABASE_URL:}
    username: ${UMS_DATABASE_USERNAME:}
    password: ${UMS_DATABASE_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IAM_ISSUER_URI:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
