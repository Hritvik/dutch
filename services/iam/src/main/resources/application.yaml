spring:
  application:
    name: dutch-iam
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      authorizationserver:
        client:
          dutch-mobile:
            registration:
              client-id: dutch-mobile
              client-authentication-methods: none
              authorization-grant-types: authorization_code,refresh_token
              redirect-uris: dutch://oauth/callback
              scopes: openid
            require-authorization-consent: false
            require-proof-key: true
iam:
  identifier-protection:
    enabled: ${IAM_IDENTIFIER_PROTECTION_ENABLED:false}
    lookup-key: ${IAM_IDENTIFIER_LOOKUP_KEY}
    encryption-key: ${IAM_IDENTIFIER_ENCRYPTION_KEY}
    key-version: ${IAM_IDENTIFIER_KEY_VERSION:1}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
