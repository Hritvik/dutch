# Example Prometheus scrape configuration for the Dutch services. The explicit
# PrometheusScrapeController serves /actuator/prometheus; ingress must expose it
# only to the monitoring network.
scrape_configs:
  - job_name: ledger
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ledger:8083"]
  - job_name: notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification:8088"]
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
