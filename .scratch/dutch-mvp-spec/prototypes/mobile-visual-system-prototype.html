<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dutch visual system — prototype</title>
  <style>
    :root{--ink:#17231c;--muted:#66736b;--line:#dfe6df;--paper:#fbfbf8;--mint:#dff3e6;--green:#146b43;--yellow:#ffd86a;--pink:#f8dce4;--shadow:0 16px 40px rgba(29,60,42,.12)}
    *{box-sizing:border-box} body{margin:0;background:#e8eee9;color:var(--ink);font:500 15px/1.35 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;letter-spacing:-.01em}.phone{width:min(100%,390px);min-height:844px;margin:24px auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:var(--shadow)}
    .screen{padding:24px 20px 108px}.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 28px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}h1,h2,p{margin:0}h1{font-size:31px;line-height:1.06;letter-spacing:-.055em}h2{font-size:19px;letter-spacing:-.03em}.avatar,.avatar-sm{display:grid;place-items:center;border-radius:50%;font-weight:800;color:#19442d}.avatar{width:42px;height:42px;background:#f5c5ac}.avatar-sm{width:32px;height:32px;background:#e6c5f4;border:2px solid var(--paper);font-size:11px}.money{font:750 39px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.075em}.positive{color:var(--green)}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:750}.dot{width:7px;height:7px;border-radius:50%;background:#61bd7e}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 2px 0 rgba(22,48,33,.02)}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.link{font-weight:800;color:var(--green);font-size:13px}.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf0ed}.row:last-child{border:0;padding-bottom:0}.grow{flex:1}.title{font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:2px}.amount{font:750 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.05em}.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,252,.94);backdrop-filter:blur(16px);display:flex;justify-content:space-around;padding:12px 10px 22px;border-top:1px solid var(--line)}.nav{font-size:11px;text-align:center;color:var(--muted);font-weight:750}.nav b{display:block;font-size:21px;line-height:21px;color:inherit}.nav.active{color:var(--green)}.fab{position:absolute;right:20px;bottom:78px;border:0;border-radius:50%;width:56px;height:56px;background:var(--green);color:#fff;font-size:29px;box-shadow:0 10px 20px rgba(20,107,67,.28)}
    /* A — calm balance-first */.a .balance{background:var(--mint);border-radius:28px;padding:24px;margin:0 -4px}.a .balance .money{margin:10px 0 12px}.a .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.a .mini{padding:14px;border-radius:16px;background:rgba(255,255,255,.65);font-size:12px}.a .mini strong{display:block;font:800 16px ui-monospace,monospace;margin-top:4px}.a .activity{border-left:3px solid var(--yellow);padding-left:11px;margin:10px 0;font-size:13px}
    /* B — command center */.b{background:#f1f5f0}.b .top{margin-bottom:18px}.b .hero{background:#1d2d23;color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden}.b .hero:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:#4ec47d;right:-38px;top:-42px;opacity:.4}.b .hero .eyebrow{color:#b8d7c2}.b .hero .money{margin:12px 0 15px}.b .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.b .quick button{border:0;border-radius:16px;background:#fff;padding:14px 5px;font:800 11px inherit;color:var(--ink);box-shadow:0 3px 12px rgba(20,58,35,.05)}.b .quick span{font-size:20px;display:block;margin-bottom:4px}.b .attention{background:var(--yellow);border-radius:19px;padding:15px;display:flex;gap:12px;align-items:center}.b .attention strong{font-size:14px}.b .group-row{background:#fff;border-radius:18px;padding:14px;margin:9px 0;display:flex;align-items:center;gap:10px}.mark{height:37px;width:37px;border-radius:12px;display:grid;place-items:center;background:var(--pink);font-size:19px}
    /* C — relationship led */.c .top{margin-bottom:20px}.c .orbit{height:228px;border-radius:50% 50% 28px 28px;background:#f2e9d3;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden}.c .orbit:before,.c .orbit:after{content:"";position:absolute;border:1px solid rgba(39,80,47,.18);border-radius:50%}.c .orbit:before{width:270px;height:150px}.c .orbit:after{width:185px;height:100px}.c .you{z-index:1;width:86px;height:86px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 5px 16px rgba(60,49,25,.12);font-size:12px;font-weight:800}.c .person{position:absolute;z-index:2;text-align:center;font-size:11px;font-weight:800}.c .person .avatar{margin:auto auto 3px;width:40px;height:40px;font-size:12px}.c .p1{top:25px;left:40px}.c .p2{top:37px;right:34px}.c .p3{bottom:24px;right:75px}.c .relationship{display:flex;gap:11px;overflow:hidden;margin:16px 0}.c .relationship .card{min-width:220px;padding:15px}.c .settle{background:var(--green);color:#fff;border:0;border-radius:17px;padding:12px 14px;font:800 13px inherit;width:100%;margin-top:10px}
    .prototype-bar{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:12px;background:#17231c;color:#fff;border-radius:999px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font:750 12px system-ui}.prototype-bar button{border:0;background:#fff;color:#17231c;border-radius:50%;width:29px;height:29px;font-size:18px;cursor:pointer}.prototype-bar small{color:#b8c6bb;font-weight:600}.throwaway{position:absolute;top:0;left:0;right:0;text-align:center;background:#17231c;color:#fff;font:700 10px system-ui;padding:4px;letter-spacing:.07em}
  </style>
</head>
<body><main class="phone" id="app"></main><div class="prototype-bar"><button id="prev" aria-label="Previous design">‹</button><span id="label"></span><small>← → to switch</small><button id="next" aria-label="Next design">›</button></div>
<script>
  const variants={
    A:{name:'Calm balance-first',html:`<section class="screen a"><div class="throwaway">THROWAWAY UI PROTOTYPE</div><header class="top"><div><p class="eyebrow">Monday, 10 August</p><h1>Good morning, Riya</h1></div><div class="avatar">R</div></header><div class="balance"><p class="eyebrow">Across 3 groups</p><div class="money positive">+₹2,480</div><p>You are owed overall</p><div class="mini-grid"><div class="mini">You are owed<strong>₹3,200</strong></div><div class="mini">You owe<strong>₹720</strong></div></div></div><div class="section"><div class="section-head"><h2>Needs attention</h2><span class="link">See all</span></div><div class="card"><div class="row"><div class="mark">🏕</div><div class="grow"><div class="title">Weekend trip</div><div class="sub">Asha paid ₹1,800 · 2h ago</div></div><div class="amount">+₹600</div></div><div class="activity">Your balance changed after a dinner edit.</div></div></div><div class="section"><div class="section-head"><h2>Recent activity</h2><span class="link">Activity</span></div><div class="row"><div class="avatar-sm">A</div><div class="grow"><span class="title">Asha</span> added Taxi<div class="sub">Weekend trip · 2h ago</div></div></div><div class="row"><div class="avatar-sm" style="background:#bfe5e1">S</div><div class="grow"><span class="title">Samar</span> settled up<div class="sub">Flat 11 · Yesterday</div></div></div></div></section>`},
    B:{name:'Compact command center',html:`<section class="screen b"><div class="throwaway">THROWAWAY UI PROTOTYPE</div><header class="top"><h1>Home</h1><div class="avatar">R</div></header><div class="hero"><p class="eyebrow">Your position · INR</p><div class="money">+₹2,480</div><span class="pill">● Updated just now</span></div><div class="quick"><button><span>＋</span>Add expense</button><button><span>↗</span>Settle up</button><button><span>⌕</span>Find activity</button></div><div class="attention"><span style="font-size:25px">✦</span><div><strong>Weekend trip changed</strong><p class="sub" style="color:#4c482b">Review the updated dinner split.</p></div></div><div class="section"><div class="section-head"><h2>Your groups</h2><span class="link">Manage</span></div><div class="group-row"><div class="mark">🏕</div><div class="grow"><div class="title">Weekend trip</div><div class="sub">4 people · ₹600 owed to you</div></div><b>›</b></div><div class="group-row"><div class="mark" style="background:#dce9fc">🏠</div><div class="grow"><div class="title">Flat 11</div><div class="sub">3 people · You owe ₹720</div></div><b>›</b></div></div></section>`},
    C:{name:'Relationship compass',html:`<section class="screen c"><div class="throwaway">THROWAWAY UI PROTOTYPE</div><header class="top"><div><p class="eyebrow">Your people</p><h1>Where you stand</h1></div><div class="avatar">R</div></header><div class="orbit"><div class="person p1"><div class="avatar" style="background:#e6c5f4">A</div>Asha<br><span class="positive">+₹1,700</span></div><div class="person p2"><div class="avatar" style="background:#bfe5e1">S</div>Samar<br><span class="muted">−₹720</span></div><div class="person p3"><div class="avatar" style="background:#f5c5ac">M</div>Maya<br><span class="positive">+₹780</span></div><div class="you">YOU<br><span class="positive">+₹2,480</span></div></div><div class="section"><div class="section-head"><h2>Settle with</h2><span class="link">All people</span></div><div class="relationship"><div class="card"><div class="row"><div class="avatar">A</div><div class="grow"><div class="title">Asha</div><div class="sub">Across Weekend trip + 1</div></div><div class="amount positive">+₹1,700</div></div><button class="settle">View balance with Asha</button></div><div class="card"><div class="title">Samar</div><p class="sub">You owe ₹720</p></div></div></div><div class="section"><h2>Groups behind this</h2><div class="row"><div class="mark">🏕</div><div class="grow"><div class="title">Weekend trip</div><div class="sub">4 people · updated 2h ago</div></div><b>›</b></div></div></section>`}
  };
  const keys=Object.keys(variants);let current=new URLSearchParams(location.search).get('variant')||'A';if(!variants[current])current='A';
  function render(){document.getElementById('app').innerHTML=variants[current].html+`<button class="fab" aria-label="Add expense">＋</button><nav class="bottom-nav"><span class="nav active"><b>⌂</b>Home</span><span class="nav"><b>◎</b>Groups</span><span class="nav"><b>◷</b>Activity</span></nav>`;document.getElementById('label').textContent=`${current} — ${variants[current].name}`;history.replaceState(null,'',`?variant=${current}`)}
  function change(dir){current=keys[(keys.indexOf(current)+dir+keys.length)%keys.length];render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)});render();
</script></body></html>
