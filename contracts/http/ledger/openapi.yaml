    ReportResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ReportView"
    DirectExpenseView:
      type: object
      additionalProperties: false
      required:
        - id
        - description
        - totalMinorUnits
        - currency
        - splitMethod
        - payers
        - shares
        - entries
        - streamIds
        - occurredAt
        - revision
      properties:
        id:
          type: string
          pattern: ^exp_[A-Za-z0-9_-]{16,128}$
        description:
          type: string
          minLength: 1
          maxLength: 200
        totalMinorUnits:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        splitMethod:
          type: string
          enum:
            - EQUAL
            - EXACT
            - PERCENTAGE
        payers:
          type: array
          items:
            $ref: "#/components/schemas/MemberAmount"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/MemberAmount"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ObligationEntryView"
        streamIds:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^direct:[A-Za-z0-9_-]{16,128}:[A-Za-z0-9_-]{16,128}:[A-Z]{3}$
        occurredAt:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
    DirectExpenseResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/DirectExpenseView"
    ActivityAction:
      type: string
      enum:
        - EXPENSE_CREATED
        - EXPENSE_CORRECTED
        - EXPENSE_DELETED
        - EXPENSE_RESTORED
        - SETTLEMENT_RECORDED
        - SETTLEMENT_VOIDED
        - MEMBERSHIP_CHANGED
    ActivityEntryView:
      type: object
      additionalProperties: false
      required:
        - activityId
        - scopeId
        - action
        - targetId
        - targetRevision
        - occurredAt
        - details
      properties:
        activityId:
          type: string
          pattern: ^act_[A-Za-z0-9_-]{16,128}$
        scopeId:
          type: string
          minLength: 1
        actor:
          $ref: "#/components/schemas/MemberId"
          description: Absent for a Former member.
        action:
          $ref: "#/components/schemas/ActivityAction"
        targetId:
          type: string
          minLength: 1
        targetRevision:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties:
            type: string
          description: A closed whitelist of non-contact details.
    ActivityListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ActivityEntryView"
