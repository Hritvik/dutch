openapi: 3.1.0
info:
  title: Dutch Ledger API
  version: 1.0.0
  description: Group and Membership surface owned by the Dutch Obligation Ledger.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/groups:
    get:
      operationId: listGroups
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Groups the caller can read.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "200":
          description: The created group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}:
    get:
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: The readable group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/groups/{groupId}/members:
    post:
      operationId: addMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipRequest"
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/groups/{groupId}/members/{memberId}:
    patch:
      operationId: changeMemberRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deactivateMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/groups/{groupId}/members/{memberId}/activate:
    post:
      operationId: activateMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/groups/{groupId}/archive:
    post:
      operationId: archiveGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The archived group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/groups/{groupId}/reopen:
    post:
      operationId: reopenGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The reopened group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/groups/{groupId}/expenses:
    post:
      operationId: createExpense
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "200":
          description: The recorded expense and its exact entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GroupId"
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MemberId"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected aggregate version; a mismatch returns 409 stale_version.
      schema:
        type: string
        pattern: ^"?[0-9]+"?$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Durable client command identity; a retry returns the stored result.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    CorrelationId:
      description: Correlation identifier echoed by the service.
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
  responses:
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access is denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The scope is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Invalid:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current group state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    GroupId:
      type: string
      pattern: ^grp_[A-Za-z0-9_-]{16,128}$
    MemberId:
      type: string
      pattern: ^mem_[A-Za-z0-9_-]{16,128}$
    GroupRole:
      type: string
      enum:
        - ADMIN
        - MEMBER
    MembershipState:
      type: string
      enum:
        - INVITED
        - PLACEHOLDER
        - ACTIVE
        - INACTIVE
    GroupState:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
    MembershipView:
      type: object
      additionalProperties: false
      required:
        - memberId
        - role
        - state
      properties:
        memberId:
          $ref: "#/components/schemas/MemberId"
        role:
          $ref: "#/components/schemas/GroupRole"
        state:
          $ref: "#/components/schemas/MembershipState"
    GroupView:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - currency
        - state
        - version
        - memberships
      properties:
        id:
          $ref: "#/components/schemas/GroupId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        state:
          $ref: "#/components/schemas/GroupState"
        version:
          type: integer
          minimum: 0
        memberships:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/MembershipView"
    GroupResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/GroupView"
    GroupListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/GroupView"
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    MembershipRequest:
      type: object
      additionalProperties: false
      required:
        - memberId
        - role
      properties:
        memberId:
          $ref: "#/components/schemas/MemberId"
        role:
          $ref: "#/components/schemas/GroupRole"
        placeholder:
          type: boolean
    RoleRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/GroupRole"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - correlationId
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - stale_version
                - last_admin
                - idempotency_conflict
                - service_unavailable
            message:
              type: string
              enum:
                - Request is invalid
                - Authentication is required
                - Access is denied
                - Resource was not found
                - The request conflicts with the current group state
                - The group changed. Refresh and retry.
                - A group must retain at least one active Admin.
                - The idempotency key was reused with a different request.
                - Service is temporarily unavailable
            correlationId:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    MemberAmount:
      type: object
      additionalProperties: false
      required:
        - memberId
        - minorUnits
      properties:
        memberId:
          $ref: "#/components/schemas/MemberId"
        minorUnits:
          type: integer
          minimum: 1
    PayerRequest:
      $ref: "#/components/schemas/MemberAmount"
    ShareRequest:
      $ref: "#/components/schemas/MemberAmount"
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required:
        - description
        - totalMinorUnits
        - currency
        - splitMethod
        - payers
        - occurredAt
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        totalMinorUnits:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        splitMethod:
          type: string
          enum:
            - EQUAL
            - EXACT
            - PERCENTAGE
        payers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/PayerRequest"
        participants:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/MemberId"
        exactShares:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ShareRequest"
        percentageBasisPoints:
          type: array
          maxItems: 1000
          items:
            type: integer
            minimum: 1
          description: Each value must be between 1 and 10000; all values must sum to exactly 10000.
        occurredAt:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              splitMethod:
                const: EQUAL
            required:
              - splitMethod
          then:
            properties:
              participants: &a1
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/MemberId"
            required:
              - participants
        - if:
            properties:
              splitMethod:
                const: PERCENTAGE
            required:
              - splitMethod
          then:
            properties:
              participants: *a1
              percentageBasisPoints:
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  type: integer
                  minimum: 1
            required:
              - participants
              - percentageBasisPoints
        - if:
            properties:
              splitMethod:
                const: EXACT
            required:
              - splitMethod
          then:
            properties:
              exactShares:
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/ShareRequest"
            required:
              - exactShares
    ObligationEntryView:
      type: object
      additionalProperties: false
      required:
        - expenseId
        - revision
        - debtor
        - creditor
        - minorUnits
        - currency
        - algorithmVersion
      properties:
        expenseId:
          type: string
          pattern: ^exp_[A-Za-z0-9_-]{16,128}$
        revision:
          type: integer
          minimum: 1
        debtor:
          $ref: "#/components/schemas/MemberId"
        creditor:
          $ref: "#/components/schemas/MemberId"
        minorUnits:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        algorithmVersion:
          type: string
          minLength: 1
          maxLength: 64
    ExpenseView:
      type: object
      additionalProperties: false
      required:
        - id
        - groupId
        - description
        - totalMinorUnits
        - currency
        - splitMethod
        - payers
        - shares
        - entries
        - occurredAt
        - revision
      properties:
        id:
          type: string
          pattern: ^exp_[A-Za-z0-9_-]{16,128}$
        groupId:
          $ref: "#/components/schemas/GroupId"
        description:
          type: string
          minLength: 1
          maxLength: 200
        totalMinorUnits:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        splitMethod:
          type: string
          enum:
            - EQUAL
            - EXACT
            - PERCENTAGE
        payers:
          type: array
          items:
            $ref: "#/components/schemas/MemberAmount"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/MemberAmount"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ObligationEntryView"
        occurredAt:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
    ExpenseResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ExpenseView"
