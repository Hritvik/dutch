name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew test jacocoTestReport verifyServiceBoundaries verifyContracts

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=critical

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=critical

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: opentofu/setup-opentofu@v1
      - run: node --test infrastructure/test/*.test.mjs
      - run: node tools/scan-secrets.mjs
      - run: tofu fmt -check -recursive infrastructure/aws
      - run: |
          for environment in development staging production; do
            tofu -chdir=infrastructure/aws/environments/$environment init -backend=false
            tofu -chdir=infrastructure/aws/environments/$environment validate
            tofu -chdir=infrastructure/aws/environments/$environment plan -input=false -refresh=false
          done
